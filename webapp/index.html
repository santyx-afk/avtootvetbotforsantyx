<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katalog</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 id="welcome-text">Assalomu alaykum!</h1>
      <p>Kerakli obunani tanlang ?'</p>
    </header>

    <div id="loader" class="loader">Kutilmoqda...</div>

    <main id="content" style="display: none;">
      <!-- Categories will be rendered here -->
    </main>

    <div id="checkout-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <button class="close-btn" id="close-modal">&times;</button>
        <h2 id="modal-title">Obuna nomi</h2>
        <div class="price-tag" id="modal-price">15000 UZS</div>
        <p id="modal-desc">Obuna haqida ma'lumot.</p>
        <div class="modal-actions">
          <button id="buy-btn" class="tg-btn">Sotib olish</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
