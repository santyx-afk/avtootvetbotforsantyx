<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>santyx — obunalar do'koni</title>
    <!-- Telegram Mini App SDK: window.Telegram.WebApp ni ta'minlaydi -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- JS yuklanmasdan ham darhol ko'rinadigan boshlang'ich spinner.
         React o'rnatilganda #root ichidagi bu placeholder avtomatik almashadi. -->
    <style>
      #app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--tg-theme-bg-color, #ffffff);
      }
      #app-boot .s {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(0, 0, 0, 0.12);
        border-top-color: #3b82f6;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #app-boot { background: var(--tg-theme-bg-color, #17212b); }
        #app-boot .s { border-color: rgba(255, 255, 255, 0.15); border-top-color: #3b82f6; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot"><div class="s"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
