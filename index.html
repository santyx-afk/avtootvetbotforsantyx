    <!--
      Birinchi chizish uchun kritik CSS + statik hero.
      Maqsad: tashrifchi JS paketini kutmasdan darhol mazmunli sahifa ko'rsin.
      React o'rnatilganda #root ichidagi bu qism bir xil ko'rinishdagi
      komponentga almashadi, shuning uchun sakrash sezilmaydi.
    -->
    <style>
      /* Sayt faqat tungi rejimda — boot ekrani ham doim dark */
      :root {
        --boot-bg: #0f141b;
        --boot-text: #eef2f7;
        --boot-hint: #93a1b1;
        --boot-line: rgba(255, 255, 255, 0.1);
      }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--tg-theme-bg-color, var(--boot-bg));
        color: var(--boot-text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #boot { min-height: 100vh; }
      #boot .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1080px;
        margin: 0 auto;
        padding: 18px 20px;
      }
      #boot .brand svg { display: block; height: 20px; width: auto; }
      #boot .hero { max-width: 760px; margin: 0 auto; padding: 56px 20px 0; text-align: center; }
      #boot h1 {
        margin: 0;
        font-size: clamp(30px, 6vw, 52px);
        line-height: 1.08;
        letter-spacing: -0.03em;
        font-weight: 800;
      }
      #boot .accent {
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #boot p {
        margin: 18px auto 30px;
        max-width: 560px;
        font-size: clamp(16px, 2.4vw, 19px);
        line-height: 1.55;
        color: var(--boot-hint);
      }
      #boot .act { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      #boot .btn {
        display: inline-block;
        padding: 15px 30px;
        border-radius: 14px;
        background: var(--boot-text);
        color: var(--boot-bg);
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
      }
      #boot .btn.ghost {
        background: transparent;
        color: var(--boot-text);
        border: 1px solid var(--boot-line);
      }
      #boot .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
      #boot .chips span {
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid var(--boot-line);
        font-size: 13px;
        color: var(--boot-hint);
      }
      /* Telegram ichida landing kerak emas — o'rniga qisqa yuklanish belgisi */
      #boot.tg .hero, #boot.tg .bar { display: none; }
      #boot .spin { display: none; }
      #boot.tg .spin {
        display: block;
        position: fixed;
        inset: 0;
        margin: auto;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid var(--boot-line);
        border-top-color: #3b82f6;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>

        </div>
        <div class="spin"></div>
      </div>

    <script>
      // Telegram Mini App ichida bo'lsak landing chizilmaydi — foydalanuvchi
      // baribir ilovaga tushadi, keraksiz kontent ko'rsatish shart emas.
      try {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
          document.getElementById('boot').className = 'tg';
        }
      } catch (e) {
        /* muhim emas */
      }
    </script>
